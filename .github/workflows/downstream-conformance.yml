name: Downstream conformance preview

on:
  pull_request:
    paths:
      - .github/workflows/downstream-conformance.yml
      - ci/**
      - evaluation-cases/**
      - ufc-config.json

permissions:
  contents: read

concurrency:
  group: downstream-conformance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dd-trace-go:
    name: dd-trace-go compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out proposed fixtures
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          path: fixtures
          persist-credentials: false

      - name: Check out dd-trace-go main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: DataDog/dd-trace-go
          ref: main
          path: downstream
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: stable
          cache: false

      - name: Resolve fixture comparison revisions
        id: revisions
        run: |
          git -C fixtures fetch --no-tags origin "${{ github.event.repository.default_branch }}"
          base_sha=$(git -C fixtures merge-base \
            "${{ github.event.pull_request.head.sha }}" \
            "origin/${{ github.event.repository.default_branch }}")
          echo "base=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Compare fixture base and head
        id: compare
        run: |
          fixtures/ci/run-downstream-conformance.sh \
            "$GITHUB_WORKSPACE/fixtures" \
            "$GITHUB_WORKSPACE/downstream" \
            openfeature/ffe-system-test-data \
            "${{ steps.revisions.outputs.base }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "$RUNNER_TEMP/downstream-conformance/dd-trace-go" \
            -- \
            go test ./openfeature -run '^TestEvaluateFlag_JSONFixtures$' -count=1

      - name: Report a candidate regression
        if: steps.compare.outputs.classification == 'new-regression'
        run: |
          echo "::warning title=New dd-trace-go fixture regression::The pull-request base passes, but the proposed fixture head fails. See the job summary and logs."

      - name: Upload comparison logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: downstream-conformance-dd-trace-go
          path: ${{ runner.temp }}/downstream-conformance/dd-trace-go/*.log
          if-no-files-found: warn

  dd-trace-java:
    name: dd-trace-java compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out proposed fixtures
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          path: fixtures
          persist-credentials: false

      - name: Check out dd-trace-java master
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: DataDog/dd-trace-java
          ref: master
          path: downstream
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: downstream/**/*.gradle*

      - name: Resolve fixture comparison revisions
        id: revisions
        run: |
          git -C fixtures fetch --no-tags origin "${{ github.event.repository.default_branch }}"
          base_sha=$(git -C fixtures merge-base \
            "${{ github.event.pull_request.head.sha }}" \
            "origin/${{ github.event.repository.default_branch }}")
          echo "base=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Compare fixture base and head
        id: compare
        run: |
          fixtures/ci/run-downstream-conformance.sh \
            "$GITHUB_WORKSPACE/fixtures" \
            "$GITHUB_WORKSPACE/downstream" \
            dd-smoke-tests/openfeature/src/test/resources/ffe-system-test-data \
            "${{ steps.revisions.outputs.base }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "$RUNNER_TEMP/downstream-conformance/dd-trace-java" \
            -- \
            ./gradlew \
              :products:feature-flagging:feature-flagging-api:cleanTest \
              :products:feature-flagging:feature-flagging-api:test \
              --tests datadog.trace.api.openfeature.DDEvaluatorTest.testEvaluateCanonicalFixture \
              --no-daemon

      - name: Report a candidate regression
        if: steps.compare.outputs.classification == 'new-regression'
        run: |
          echo "::warning title=New dd-trace-java fixture regression::The pull-request base passes, but the proposed fixture head fails. See the job summary and logs."

      - name: Upload comparison logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: downstream-conformance-dd-trace-java
          path: ${{ runner.temp }}/downstream-conformance/dd-trace-java/*.log
          if-no-files-found: warn
