name: Precomputed fixture validation

on:
  pull_request:
    paths:
      - .github/workflows/validate-precomputed-fixtures.yml
      - ci/validate-precomputed-fixtures.py
      - schemas/precomputed-assignment.schema.json
      - precomputed-assignments/**

permissions:
  contents: read

concurrency:
  group: precomputed-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate precomputed assignment fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate precomputed fixtures
        run: python3 ci/validate-precomputed-fixtures.py
