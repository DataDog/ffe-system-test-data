name: Downstream compatibility preview

on:
  pull_request:
    paths:
      - .github/workflows/downstream-compatibility.yml
      - ci/run-downstream-conformance.sh
      - evaluation-cases/**
      - ufc-config.json

permissions:
  contents: read

concurrency:
  group: downstream-compatibility-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  downstream:
    name: ${{ matrix.slug }} compatibility (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: dd-trace-go
            repository: DataDog/dd-trace-go
            runtime: go
            submodule: openfeature/ffe-system-test-data
            setup: ":"
            evaluation: go test ./openfeature -run '^TestEvaluateFlag_JSONFixtures$' -count=1
          - slug: dd-trace-java
            repository: DataDog/dd-trace-java
            runtime: java
            submodule: dd-smoke-tests/openfeature/src/test/resources/ffe-system-test-data
            setup: ":"
            evaluation: >-
              ./gradlew
              :products:feature-flagging:feature-flagging-api:cleanTest
              :products:feature-flagging:feature-flagging-api:test
              --tests datadog.trace.api.openfeature.DDEvaluatorTest.testEvaluateCanonicalFixture
              --no-daemon
          - slug: dd-trace-js
            repository: DataDog/dd-trace-js
            runtime: node
            submodule: packages/dd-trace/test/openfeature/ffe-system-test-data
            setup: >-
              npm install -g bun@1.3.1 --prefer-offline --no-audit --no-fund &&
              bun install --linker=hoisted --trust --network-concurrency 8
            evaluation: npm run test:openfeature -- --grep 'canonical FFE fixtures'
          - slug: dd-trace-py
            repository: DataDog/dd-trace-py
            runtime: python
            submodule: tests/openfeature/ffe-system-test-data
            setup: ":"
            evaluation: >-
              scripts/ddtest riot -v run --pass-env -s 13c4b39 -- -vv
              tests/openfeature/test_provider_fixtures.py
          - slug: dd-trace-rb
            repository: DataDog/dd-trace-rb
            runtime: ruby
            submodule: spec/datadog/open_feature/ffe-system-test-data
            setup: bundle install --jobs 4 && bundle exec rake compile
            evaluation: >-
              bundle exec rspec spec/datadog/open_feature/native_evaluator_spec.rb
              -e 'canonical FFE fixtures'
          - slug: dd-trace-dotnet
            repository: DataDog/dd-trace-dotnet
            runtime: dotnet
            submodule: tracer/test/Datadog.Trace.Tests/FeatureFlags/ffe-system-test-data
            setup: >-
              dotnet restore
              tracer/test/Datadog.Trace.Tests/Datadog.Trace.Tests.csproj
            evaluation: >-
              dotnet test tracer/test/Datadog.Trace.Tests/Datadog.Trace.Tests.csproj
              --framework net10.0 --no-restore
              --filter 'FullyQualifiedName~Datadog.Trace.Tests.FeatureFlags.FeatureFlagsEvaluatorTests.BundledTest'
              --verbosity minimal
          - slug: dd-trace-php
            repository: DataDog/dd-trace-php
            runtime: php
            submodule: tests/FeatureFlags/ffe-system-test-data
            setup: ":"
            evaluation: >-
              make test_c TESTS=tests/ext/ffe/system_test_data_evaluate.phpt
              MAX_TEST_PARALLELISM=1
          - slug: libdatadog
            repository: DataDog/libdatadog
            runtime: rust
            submodule: libdd-ffe-test-suite/ffe-system-test-data
            setup: rustup toolchain install 1.87.0 --profile minimal
            evaluation: >-
              cargo +1.87.0 test -p libdd-ffe-test-suite
              --test canonical_fixtures -- --nocapture

    steps:
      - name: Check out proposed fixtures
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          path: fixtures
          persist-credentials: false

      - name: Check out ${{ matrix.slug }} fixture-test branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.repository }}
          ref: leo.romanovsky/ffe-regex-conformance-pr21
          path: downstream
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        if: matrix.runtime == 'go'
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: stable
          cache: false

      - name: Set up Java
        if: matrix.runtime == 'java'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: downstream/**/*.gradle*

      - name: Set up Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up Python
        if: matrix.runtime == 'python'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up Ruby
        if: matrix.runtime == 'ruby'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"

      - name: Set up .NET
        if: matrix.runtime == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Set up PHP
        if: matrix.runtime == 'php'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install ${{ matrix.slug }} dependencies
        env:
          SETUP_COMMAND: ${{ matrix.setup }}
        working-directory: downstream
        run: bash -lc "$SETUP_COMMAND"

      - name: Resolve fixture comparison revisions
        id: revisions
        run: |
          git -C fixtures fetch --no-tags origin "${{ github.event.repository.default_branch }}"
          base_sha=$(git -C fixtures merge-base \
            "${{ github.event.pull_request.head.sha }}" \
            "origin/${{ github.event.repository.default_branch }}")
          echo "base=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Compare canonical evaluation behavior
        id: evaluation
        env:
          TEST_COMMAND: ${{ matrix.evaluation }}
        run: |
          fixtures/ci/run-downstream-conformance.sh \
            "$GITHUB_WORKSPACE/fixtures" \
            "$GITHUB_WORKSPACE/downstream" \
            "${{ matrix.submodule }}" \
            "${{ steps.revisions.outputs.base }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "$RUNNER_TEMP/downstream-conformance/${{ matrix.slug }}" \
            -- \
            bash -lc "$TEST_COMMAND"

      - name: Report compatibility finding
        if: steps.evaluation.outputs.classification != 'compatible'
        env:
          CLASSIFICATION: ${{ steps.evaluation.outputs.classification }}
        run: |
          echo "::warning title=${{ matrix.slug }} fixture compatibility::Classification: $CLASSIFICATION. This is informational; inspect the job summary and attached logs before deciding whether the SDK or fixture needs a fix."

      - name: Upload comparison logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: downstream-compatibility-${{ matrix.slug }}
          path: ${{ runner.temp }}/downstream-conformance/${{ matrix.slug }}/*.log
          if-no-files-found: warn
