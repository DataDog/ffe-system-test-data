name: Fixture validation

on:
  pull_request:
    paths:
      - .github/workflows/validate-fixtures.yml
      - ci/validate-fixtures.py
      - evaluation-cases/**
      - ufc-config.json

permissions:
  contents: read

concurrency:
  group: fixture-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate fixture JSON and references
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate fixtures
        run: python3 ci/validate-fixtures.py
