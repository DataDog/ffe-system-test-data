name: Response signing fixture validation

on:
  pull_request:
    paths:
      - .github/workflows/validate-response-signing.yml
      - ci/validate-response-signing.py
      - ci/test_validate_response_signing.py
      - schemas/response-signing-v1.schema.json
      - response-signing/**

permissions:
  contents: read

concurrency:
  group: response-signing-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate response signing fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: pip install jsonschema cryptography==46.0.3
      - name: Verify boundary fixture reproducibility and signatures
        run: python3 response-signing/generate-boundary-supplements.py --check
      - name: Validate response signing fixtures
        run: python3 ci/validate-response-signing.py
      - name: Test response signing fixture validation
        run: python3 -m unittest discover -s ci -p 'test_validate_response_signing.py'
